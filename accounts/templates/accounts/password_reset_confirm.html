{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha — Braga Treinamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --brand-primary: #FFE81F; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at top left, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .brand-logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--brand-primary);
            letter-spacing: -1px;
            text-align: center;
            margin-bottom: 1rem;
        }
        .form-control {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: var(--brand-primary);
            color: #fff;
            box-shadow: 0 0 0 3px rgba(255,232,31,0.2);
        }
        .btn-brand {
            background: var(--brand-primary);
            color: #000;
            font-weight: 700;
            border-radius: 10px;
            padding: 0.75rem;
            font-size: 1rem;
            border: none;
            transition: all 0.2s;
        }
        .btn-brand:hover {
            background: #e6d01c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,232,31,0.3);
        }
    </style>
</head>
<body>

<div class="auth-card mx-3">
    <div class="brand-logo">
        <i class="bi bi-key-fill me-2"></i>Nova Senha
    </div>
    
    {% if validlink %}
        <p class="text-center text-body-secondary mb-4">
            Por favor, digite sua nova senha abaixo.
        </p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-brand w-100 mt-3">
                <i class="bi bi-check2-circle me-2"></i>Salvar Nova Senha
            </button>
        </form>
    {% else %}
        <p class="text-center text-danger mb-4">
            O link de recuperação de senha é inválido ou já expirou. 
            Por favor, solicite um novo link.
        </p>
        <div class="text-center">
            <a href="{% url 'accounts:password_reset' %}" class="btn btn-outline-light w-100">
                Solicitar novo link
            </a>
        </div>
    {% endif %}
    
</div>

</body>
</html>
